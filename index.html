function badge(t){return `<span class="badge ${t.status==='waiting'?'gold':['cancelled','paused'].includes(t.status)?'gray':''}"><span class="dot"></span>${statusNames[t.status]}</span>`;}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));storageOK=true;}catch{storageOK=false;notify('이 브라우저에서는 진행 상황을 저장할 수 없어요. 이 화면을 열어 두세요.');}}
function reload(){try{const v=readStoredData();if(v&&Array.isArray(v.tasks)&&v.settings)db=v;}catch{}}
function isPending(t){return t.status==='waiting'||t.status==='paused'&&t.previous==='waiting';}
function current(){return db.tasks.find(t=>t.id===active);}
function notify(text){const el=document.querySelector('#toast');el.textContent=text;el.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>el.classList.remove('show'),3800);}
function changeTask(id,action,payload){reload();const i=db.tasks.findIndex(t=>t.id===id);if(i<0)throw Error('이 일을 찾을 수 없어요.');db.tasks[i]=transition(db.tasks[i],action,payload);persist();return db.tasks[i];}
function go(v,id){view=v;if(id)active=id;render();window.scrollTo({top:0,behavior:'instant'});}
function start(kind){reload();const pending=db.tasks.find(t=>t.kind===kind&&!['completed','cancelled'].includes(t.status));if(pending){active=pending.id;if(pending.status==='paused')changeTask(pending.id,'resume');notify('저장한 곳부터 이어서 할 수 있어요.');}else{const t=createTask(kind);db.tasks.unshift(t);active=t.id;persist();}go('task',active);}

function composer(context){return `<form class="compose" data-form="chat" data-context="${context}"><input name="message" aria-label="하고 싶은 일 입력" placeholder="글을 쓰거나 마이크를 눌러 말해 주세요…" maxlength="500" autocomplete="off"><button type="button" class="mic" data-action="voice" aria-label="음성 입력 시작">${icon('mic')}</button><button type="submit" class="input-send" aria-label="보내기">${icon('send')}</button></form>`;}
function productArt(type,idx=0){if(type==='cooker')return `<svg class="product-art" viewBox="0 0 160 120" aria-hidden="true"><ellipse cx="80" cy="109" rx="48" ry="5" fill="#d5dccb"/><path d="M34 45q-9 8-8 23m100-23q9 8 8 23" fill="none" stroke="#a3aa9b" stroke-width="8"/><rect x="38" y="33" width="84" height="70" rx="25" fill="${idx?'#d6c9b6':'#f8f6ed'}" stroke="#d8dcd0" stroke-width="2"/><ellipse cx="80" cy="37" rx="42" ry="16" fill="#e7e8dc"/><ellipse cx="80" cy="34" rx="34" ry="10" fill="#f9faf4"/><path d="M69 23v-5q11-6 22 0v5" fill="none" stroke="#9caa96" stroke-width="6" stroke-linecap="round"/><rect x="60" y="62" width="40" height="24" rx="7" fill="${idx?'#636b59':'#8c9e79'}"/>${idx?'<path d="M68 69h24m-24 8h9m6 0h9" stroke="#e6e6cf" stroke-width="3"/>':'<circle cx="71" cy="74" r="4" fill="#e8edce"/><circle cx="89" cy="74" r="4" fill="#d2dfbe"/>'}<path d="M47 101v6m66-6v6" stroke="#9ba591" stroke-width="6" stroke-linecap="round"/></svg>`;
if(type==='salon')return `<svg class="product-art" viewBox="0 0 160 120" aria-hidden="true"><ellipse cx="80" cy="109" rx="48" ry="5" fill="#d6ddcb"/><rect x="44" y="19" width="73" height="74" rx="14" fill="#c1cbb5"/><rect x="50" y="25" width="61" height="62" rx="10" fill="#e5e9db"/><path d="m60 77 41-41m-27 7 12-12" stroke="#f8f9f0" stroke-width="5"/><rect x="55" y="72" width="52" height="21" rx="10" fill="#9aac8d"/><path d="M81 92v14m-22 2h44" stroke="#6c7b61" stroke-width="5"/><circle cx="126" cy="76" r="8" stroke="#9b9c82" fill="none" stroke-width="3"/><circle cx="137" cy="87" r="8" stroke="#9b9c82" fill="none" stroke-width="3"/><path d="m121 69-19-19m29 29-20-38" stroke="#9b9c82" stroke-width="3"/></svg>`;
return `<svg class="product-art" viewBox="0 0 160 120" aria-hidden="true"><ellipse cx="80" cy="106" rx="52" ry="6" fill="#d7ddcc"/><ellipse cx="80" cy="70" rx="58" ry="35" fill="#f8f9f0" stroke="#dce0d1" stroke-width="3"/><ellipse cx="80" cy="69" rx="48" ry="27" fill="#eeedda"/><ellipse cx="58" cy="66" rx="22" ry="20" fill="#fffef7"/>${idx?'<path d="m84 53 26 8-7 17-24-7Z" fill="#e0b359"/><path d="m83 65 17 15 15-11-15-12Z" fill="#cb6f50"/>':'<ellipse cx="99" cy="62" rx="22" ry="12" fill="#cfaa7b"/><path d="m118 63 12-9v17Z" fill="#c39d72"/><path d="M88 61h18" stroke="#a88c62" stroke-width="2"/>'}<ellipse cx="91" cy="85" rx="14" ry="6" fill="#87a36a"/><ellipse cx="110" cy="80" rx="12" ry="6" fill="#9eb780"/></svg>`;}
function options(t,child=false){const s=scenarios[t.kind];const chosen=child?selectedReply[t.id]:t.selected;return `<div class="option-grid">${s.options.map((o,i)=>`<article class="option ${chosen===o.id?'chosen':''}"><div class="option-art"><span class="badge">${o.tag}</span><span class="choice-mark">${chosen===o.id?'✓':''}</span>${productArt(o.art,i)}</div><div class="option-body"><h3>${e(o.name)}</h3><p class="subtitle">${e(o.sub)}</p><div class="price">${money(o.price)}<small>${o.shipping?' + 배송비 '+money(o.shipping):''}</small></div><ul>${o.details.map(x=>`<li>${e(x)}</li>`).join('')}</ul><p class="terms">${e(o.terms)}</p><button class="btn ${chosen===o.id?'primary':'secondary'} full" data-action="${child?'recommend-select':'select'}" data-id="${t.id}" data-option="${o.id}" ${!child&&!['choosing','advised'].includes(t.status)?'disabled':''}>${chosen===o.id?icon('check')+' 선택함':child?'이 항목 추천':'이 항목 고르기'}</button></div></article>`).join('')}</div>`;}
function taskSummary(t){const s=scenarios[t.kind];return `<section class="panel"><div class="row between"><h2>요청 요약</h2>${icon('book')}</div><dl class="summary-list"><dt>할 일</dt><dd>${e(s.short)}</dd><dt>원하는 조건</dt><dd>${e(t.request?.need||s.need)}</dd><dt>예산</dt><dd>${money(s.budget)}</dd><dt>진행 상태</dt><dd>${statusNames[t.status]}</dd></dl><div class="rule"></div><p class="tiny muted">상품, 가격, 예약 시간은 모두 체험용 예시예요.</p>${!['completed','cancelled','paused'].includes(t.status)?`<button class="btn secondary full" data-action="pause" data-id="${t.id}">${icon('pause')}저장하고 나중에 하기</button><button class="textbtn danger full" data-action="cancel" data-id="${t.id}">이 일 취소하기</button>`:''}</section><section class="panel"><h2>진행 기록</h2><ol class="timeline">${t.events.slice(-6).map(x=>`<li>${e(x.text)}<time>${time(x.at)}</time></li>`).join('')}</ol></section>`;}
function taskPage(){if(role==='child')return childHome();const t=current();if(!t)return empty('이 일을 찾을 수 없어요','홈에서 다시 시작해 주세요.');if(t.status==='checkout')return checkout(t);const s=scenarios[t.kind];let phase=t.status==='waiting'||t.status==='advised'?2:t.status==='completed'?3:1;return `<div class="task-title"><button class="textbtn" data-action="go" data-view="tasks">${icon('back')}내가 할 일</button><div class="row between"><h1>${e(t.title)}</h1>${badge(t)}</div></div><ol class="steps">${['요청하기','비교하기','가족에게 묻기','직접 확인하기'].map((x,i)=>`<li class="step ${i<=phase?'current':''}"><span>${i<phase?'✓':i+1}</span>${x}</li>`).join('')}</ol><div class="tasklayout"><div class="task-main"><section class="chat" aria-label="곁에 도우미와의 대화">${t.messages.map(m=>`<div class="message ${m.role}">${m.role==='user'?avatar():ai()}<div class="bubble">${e(m.text)}</div></div>`).join('')}${!['completed','cancelled','paused'].includes(t.status)?composer('task'):''}</section>${t.status==='paused'?`<div class="state-box"><span class="state-icon">${icon('pause')}</span><h2>진행 상황을 저장했어요</h2><p>골라 둔 항목과 가족의 답변을 그대로 확인할 수 있어요.</p><button class="btn primary" data-action="resume" data-id="${t.id}" style="margin-top:18px">이어서 하기 ${icon('arrow')}</button></div>`:t.status==='completed'?receipt(t):t.status==='cancelled'?'<div class="state-box"><h2>이 일을 취소했어요</h2><p>실제 주문과 결제 금액은 없어요.</p><button class="btn primary" data-action="go" data-view="home" style="margin-top:18px">홈으로</button></div>':`${t.status==='waiting'?waiting(t):''}${t.status==='advised'?replyCard(t):''}${options(t)}${t.kind==='haircut'?bookingFields(t):''}${['choosing','advised'].includes(t.status)?`<div class="task-actions"><button class="btn assist-action" data-action="ask" data-id="${t.id}">${icon('heart')}딸에게 물어보기</button><button class="btn primary" data-action="review" data-id="${t.id}" ${!t.selected?'disabled':''}>선택 내용 확인하기 ${icon('arrow')}</button></div><p class="tiny muted" style="margin-top:12px">가족 의견을 들어보고 마지막에 직접 선택하세요.</p>`:''}`} </div><aside class="rightcol">${taskSummary(t)}</aside></div>`;}
function bookingFields(t){const min=new Date();min.setDate(min.getDate()+1);const date=min.getFullYear()+'-'+String(min.getMonth()+1).padStart(2,'0')+'-'+String(min.getDate()).padStart(2,'0');return `<div class="panel" style="margin-top:20px"><h3>언제로 예약할까요?</h3><div class="formrow"><label class="field">예약 날짜<input type="date" id="booking-date" value="${e(t.date)}" min="${date}" ${t.status==='waiting'?'disabled':''}></label><label class="field">예약 시간<select id="booking-time" ${t.status==='waiting'?'disabled':''}>${['10:00','11:00','14:00','15:00','16:00'].map(x=>`<option ${x===t.time?'selected':''}>${x}</option>`).join('')}</select></label></div><p class="tiny muted">예약 시간은 체험용 예시예요.</p></div>`;}
function waiting(t){return `<div class="state-box"><div class="row between"><span class="state-icon">${icon('heart')}</span><span class="badge gold">가족 답변 대기</span></div><h2>딸에게 도움을 요청했어요</h2><p>원하는 조건, 두 가지 후보, 궁금한 점을 자녀용 화면에 표시했어요. 다른 일을 하다가 돌아와도 돼요.</p><div class="row wrap" style="margin-top:17px"><button class="btn primary" data-action="role" data-role="child">자녀용 화면에서 답변하기 ${icon('arrow')}</button><button class="textbtn" data-action="revoke" data-id="${t.id}">요청을 철회하고 직접 고르기</button></div></div>`;}
function replyCard(t){const o=scenarios[t.kind].options.find(o=>o.id===t.reply.id);return `<section class="reply"><div class="row">${avatar('child')}<div><h3>딸이 의견을 보냈어요</h3><span class="tiny muted">추천 항목 · ${e(o.name)}</span></div></div><p>“${e(t.reply.text)}”</p><button class="btn soft" data-action="select" data-id="${t.id}" data-option="${o.id}">${icon('check')}추천 항목 고르기</button><button class="textbtn" style="margin-left:14px" data-action="speak" data-text="${e('딸이 추천한 항목은 '+o.name+'. '+t.reply.text)}">${icon('volume')}들어 보기</button></section>`;}
function empty(title,sub,button='홈으로'){return `<section class="empty"><div class="state-icon">${icon('leaf')}</div><h2>${title}</h2><p>${sub}</p><button class="btn primary" data-action="go" data-view="home">${button} ${icon('arrow')}</button></section>`;}
function tasksPage(){const visibleTasks=role==='child'?db.tasks.filter(t=>t.request):db.tasks;return intro(role==='elder'?'내가 할 일':'가족 기록','진행 중인 일과 마친 일을 확인할 수 있어요.')+(visibleTasks.length?`<div class="tasklist">${visibleTasks.map(t=>`<article class="taskrow"><span class="mini-icon">${icon(scenarios[t.kind].icon)}</span><div class="grow"><h3>${e(t.title)} ${badge(t)}</h3><p>${new Date(t.createdAt).toLocaleDateString('ko-KR')} · ${e(t.events.at(-1)?.text)}</p></div><button class="btn secondary" data-action="${role==='child'?'child-open':'open-task'}" data-id="${t.id}">${t.status==='completed'?'체험 확인증 보기':'진행 상황 보기'} ${icon('arrow')}</button></article>`).join('')}</div>`:empty('아직 진행한 일이 없어요','홈에서 전기밥솥 구매, 미용실 예약, 점심 주문을 체험해 보세요.'));}
function childHome(){const waiting=db.tasks.filter(isPending);const done=db.tasks.filter(t=>t.reply&&t.request).length;return intro('가족의 요청','어르신이 공유에 동의한 요청에 답변할 수 있어요.')+`<section class="child-banner">${avatar('child')}<div><h2>자녀용 체험</h2><p>추천할 항목을 고르고 이유를 남겨 보세요.</p></div><div class="stats"><div class="stat"><strong>${waiting.length}</strong><span>답변 대기</span></div><div class="stat"><strong>${done}</strong><span>답변 완료</span></div></div></section><div class="tasklayout"><div>${waiting.length?waiting.map(childCard).join(''):empty('아직 받은 요청이 없어요','어르신용 화면에서 항목을 고른 뒤 ‘딸에게 물어보기’를 누르고 공유에 동의해 보세요.','가족 홈으로')}${waiting.length?'':`<button class="btn secondary full" style="margin-top:15px" data-action="role" data-role="elder">어르신용 화면으로 ${icon('arrow')}</button>`}${db.tasks.some(t=>t.reply&&t.request)?`<div class="section-title"><h2>보낸 의견</h2></div>${db.tasks.filter(t=>t.reply&&t.request).map(t=>`<article class="taskrow" style="margin-bottom:13px"><span class="mini-icon">${icon('check')}</span><div class="grow"><h3>${e(t.title)}</h3><p>${t.status==='completed'?'어르신이 체험을 마쳤어요.':'의견을 보냈어요. 어르신의 확인을 기다리고 있어요.'}</p><p class="tiny muted">${e(t.reply.text)}</p></div>${badge(t)}</article>`).join('')}`:''}</div><aside class="rightcol"><section class="panel"><h2>가족이 도울 수 있는 일</h2><dl class="summary-list"><dt>볼 수 있는 내용</dt><dd>공유에 동의한 조건, 후보, 궁금한 점</dd><dt>할 수 있는 일</dt><dd>항목을 추천하고 이유 남기기</dd><dt>최종 확인</dt><dd>어르신이 직접 확인해요.</dd></dl><p class="tiny muted">두 화면은 같은 브라우저에서 체험해요. 실제 연락처로 메시지는 전송되지 않아요.</p></section><div class="tip-panel"><h3>${icon('heart')}추천 이유 쓰는 법</h3><p>‘버튼이 두 개라 조작하기 쉬워 보여요’처럼 구체적으로 적어 보세요.</p></div></aside></div>`;}
function childCard(t){const s=scenarios[t.kind];return `<article class="child-request" id="request-${t.id}"><div class="row between"><div class="row">${avatar()}<span class="small">어르신이 보낸 도움 요청</span></div>${badge(t)}</div><h2>${e(t.title)}</h2><p class="small muted">아래 내용을 보고 어떤 항목이 맞을지 골라 주세요.</p><div class="need-grid"><div class="needbox"><strong>원하는 조건</strong><p>${e(t.request.need)}</p></div><div class="needbox"><strong>궁금한 점</strong><p>${e(t.request.concern)}</p></div></div><p class="tiny muted" style="margin-bottom:15px">이 일의 조건, 후보, 궁금한 점만 공유돼요.</p>${options(t,true)}<form data-form="reply" data-id="${t.id}"><label class="field">추천하는 이유를 적어 주세요<textarea name="advice" placeholder="예를 들어, 버튼이 두 개라 사용하기 쉬워 보여요." required maxlength="300">${e(adviceDrafts[t.id]??(selectedReply[t.id]?selectedReply[t.id]===s.options[0].id?'첫 번째 항목을 추천해요. '+s.options[0].details[0]+'. 마음에 드는 쪽을 골라 보세요.':'두 번째 항목을 추천해요. '+s.options[1].details[0]+'. 마음에 드는 쪽을 골라 보세요.':''))}</textarea></label><div class="row wrap"><button class="btn primary grow" type="submit" ${!selectedReply[t.id]?'disabled':''}>${icon('send')}어르신에게 의견 보내기</button><button class="btn secondary" type="button" data-action="call" data-id="${t.id}">${icon('phone')}대화할 내용 보기</button></div></form></article>`;}
function familyPage(){if(role==='child')return childHome();return intro('내 가족','공유한 요청과 가족의 답변을 확인할 수 있어요.')+`<div class="settings-grid"><div class="stack">${familyPanel()}<section class="panel"><h2>요청을 공유할 때</h2><dl class="summary-list"><dt>공유 내용</dt><dd>이 일에 필요한 조건, 후보, 궁금한 점만 공유해요.</dd><dt>최종 결정</dt><dd>자녀는 의견을 남기고, 최종 선택은 어르신이 해요.</dd><dt>요청 철회</dt><dd>답변을 기다리는 동안 요청을 철회하고 직접 고를 수 있어요.</dd></dl></section></div><section class="panel"><h2>가족에게 공유한 일</h2>${db.tasks.filter(t=>t.request).length?db.tasks.filter(t=>t.request).map(t=>`<div class="task-preview">${badge(t)}<h3>${e(t.title)}</h3><p>${e(t.request.concern)}</p><button class="textbtn" data-action="open-task" data-id="${t.id}">내용 보기 ${icon('arrow')}</button></div>`).join(''):'<div class="empty-mini">'+icon('heart')+'<p>가족에게 공유한 일이 없어요.<br>도움이 필요할 때 ‘딸에게 물어보기’를 눌러 보세요.</p></div>'}<div class="rule"></div><p class="small muted">이 화면에는 체험용 가족이 표시돼요. 정식 서비스에서는 양쪽의 동의와 본인 확인을 거쳐 가족을 연결할 계획이에요.</p></section></div>`;}
function settingsPage(){return intro('설정','글자 크기, 음성 읽기, 브라우저에 저장한 기록을 관리하세요.')+`<div class="settings-grid"><section class="panel"><h2>화면과 음성</h2><div class="setting-row"><div><h3>큰 글씨</h3><p>설명과 선택 항목, 주요 버튼의 글자를 키워요.</p></div><button class="toggle" role="switch" aria-label="큰 글씨" aria-checked="${db.settings.large}" data-action="font"></button></div><div class="setting-row"><div><h3>도우미 답변 자동으로 읽기</h3><p>브라우저가 답변을 읽어 줘요. ‘들어 보기’를 눌러 직접 들을 수도 있어요.</p></div><button class="toggle" role="switch" aria-label="자동 읽기" aria-checked="${db.settings.read}" data-action="read-toggle"></button></div><div class="setting-row"><div><h3>음성 미리 듣기</h3><p>한국어 음성은 기기와 브라우저 설정에 따라 달라요.</p></div><button class="btn secondary" data-action="speak" data-text="안녕하세요, 생활 도우미 곁에입니다. 하고 싶은 일을 같이 살펴봐요.">${icon('volume')}미리 듣기</button></div><div class="setting-row"><div><h3>읽기 멈추기</h3><p>재생 중인 음성을 멈춰요.</p></div><button class="iconbtn" aria-label="읽기 멈추기" data-action="stop-speak">${icon('close')}</button></div></section><section class="panel"><h2>체험 기록</h2><div class="setting-row"><div><h3>기록 내보내기</h3><p>이 브라우저의 체험 기록을 JSON 파일로 저장해요.</p></div><button class="btn secondary" data-action="export">내보내기</button></div><div class="setting-row"><div><h3>진행 상황 저장</h3><p>새로고침한 뒤에도 같은 브라우저에서 이어서 할 수 있어요.<br>다른 기기와 기록은 동기화되지 않아요.</p></div>${icon('shield')}</div><div class="setting-row"><div><h3>체험 기록 지우기</h3><p>이 브라우저의 체험 기록을 모두 지워요.</p></div><button class="btn secondary danger" data-action="reset">지우기</button></div><div class="setting-row"><div><h3>서비스 소개와 참고 자료</h3><p>체험 기능, 참고 자료, 개발 계획을 확인할 수 있어요.</p></div><button class="iconbtn" aria-label="서비스 소개 보기" data-action="go" data-view="about">${icon('arrow')}</button></div></section></div>`;}
function aboutPage(){return `<section class="about-hero"><h1>도우미와 함께 살펴보고 직접 결정해요</h1><p>곁에는 디지털 서비스 사용이 어려운 어르신을 위한 생활 도우미예요. 상품이나 예약 조건을 쉽게 비교하고, 필요하면 가족에게 의견을 물은 뒤 이어서 진행할 수 있어요.</p></section><div class="about-grid">${[['mic','말로 시작하기','원하는 일을 말하거나 글로 입력할 수 있어요. 큰 글씨로 후보를 두 가지씩 비교해요.'],['heart','필요한 내용만 공유','요청마다 어르신의 동의를 받고, 자녀에게 원하는 조건과 후보, 궁금한 점을 보여 줘요.'],['shield','어르신이 직접 확인','가족의 의견을 참고해 어르신이 고른 항목과 금액을 직접 확인해요. 정식 버전의 결제는 가게 페이지에서 진행할 계획이에요.']].map(([i,t,d])=>`<section class="panel"><span class="service-icon">${icon(i)}</span><h3>${t}</h3><p>${d}</p></section>`).join('')}</div><div class="settings-grid" style="margin-top:24px"><section class="panel"><h2>체험할 수 있는 기능</h2><dl class="summary-list"><dt>주요 기능</dt><dd>구매, 예약, 주문에서 후보 비교와 가족 의견 요청, 저장, 최종 확인을 체험할 수 있어요.</dd><dt>음성 기능</dt><dd>음성 입력과 읽어 주기는 브라우저와 기기가 지원하는 경우 사용할 수 있어요.</dd><dt>체험 범위</dt><dd>정해진 예시 대화, 상품, 가게, 결제 화면으로 진행하는 체험이에요.</dd><dt>저장 위치</dt><dd>체험 기록은 이 브라우저에 저장돼요. 같은 브라우저에서 어르신용과 자녀용 화면을 바꿔 볼 수 있어요.</dd></dl></section><section class="panel"><h2>정식 서비스 개발 계획</h2><dl class="summary-list"><dt>초기 서비스</dt><dd>일상 구매와 예약에 집중해 일부 가게와 연동을 검증해요.</dd><dt>서비스 연동</dt><dd>언어 모델과 사용자가 승인한 브라우저 작업, 가족 계정 연결, 메시지 전송을 검토해요.</dd><dt>결제</dt><dd>가게, 총금액, 취소 조건을 표시해요. 로그인, 인증, 결제는 사용자가 직접 확인해요.</dd><dt>운영 방식</dt><dd>기본 기능을 무료로 제공하고 가족 구독과 지역 돌봄 기관 협력을 검토해요. 가격은 사용자 인터뷰로 검증할 계획이에요.</dd></dl></section></div><section class="panel" style="margin-top:24px"><h2>참고 서비스와 자료</h2><p class="tiny muted" style="margin-top:8px">아래는 기획에 참고한 자료예요. 확인일은 2026년 11월 6일이에요.</p><div class="source"><a href="https://www.alibabagroup.com/zh-HK/document-1948497434959151104" target="_blank" rel="noopener noreferrer">첸원 앱 · 알리바바 공식 소개 (2026-01-15) ${icon('external')}</a><p>일상 언어로 음식 주문, 이동, 구매를 시작하는 방식과 알리바바 서비스 연동 사례를 참고했어요.</p></div><div class="source"><a href="https://home.alibabagroup.com/en-US/document-1506469390227341312" target="_blank" rel="noopener noreferrer">타오바오 어르신 모드 · 알리바바 접근성 사례 ${icon('external')}</a><p>눈에 잘 띄는 음성 입력과 큰 글씨 등 접근성 기능을 참고했어요.</p></div><div class="source"><a href="https://github.com/zai-org/Open-AutoGLM" target="_blank" rel="noopener noreferrer">Open-AutoGLM · 공식 오픈소스 프로젝트 ${icon('external')}</a><p>화면을 읽고 작업을 계획하며, 민감한 단계는 사용자에게 확인하는 방식을 참고했어요.</p></div><div class="source"><a href="https://techcrunch.com/2022/12/02/google-shuts-down-duplex-on-the-web-its-attempt-to-bring-ai-smarts-to-retail-sites-and-more/" target="_blank" rel="noopener noreferrer">Duplex on the Web · TechCrunch（2022-12-02） ${icon('external')}</a><p>어르신을 위한 일상 서비스의 사용성을 기획할 때 참고했어요.</p></div></section>`;}
function checkout(t){const s=scenarios[t.kind],o=s.options.find(x=>x.id===t.selected);return `<div class="merchant"><button class="textbtn" data-action="back-checkout" data-id="${t.id}">${icon('back')}돌아가서 다시 고르기</button><div class="merchant-brand"><div class="row">${icon('bag')}<strong>${e(o.merchant)}</strong></div><span class="badge gold">가게 결제 체험</span></div><section class="merchant-card"><div class="row between"><h1>선택 내용을 확인해 주세요</h1>${icon('shield')}</div><p class="small muted" style="margin-top:8px">가게 화면에서 선택한 항목과 금액을 확인하는 체험이에요.</p><div class="checkout-item">${productArt(o.art,s.options.indexOf(o))}<div><h3>${e(o.name)}</h3><p>${e(o.sub)}</p><p>수량 1개</p></div></div>${t.kind==='haircut'?`<div class="bill"><span>예약 시간</span><span>${e(t.date)} ${e(t.time)}</span></div>`:''}<div class="bill"><span>${t.kind==='haircut'?'이용 금액':'상품 금액'}</span><span>${money(o.price)}</span></div><div class="bill"><span>배송비</span><span>${money(o.shipping)}</span></div><div class="bill total"><span>총금액</span><span>${money(o.price+o.shipping)}</span></div><p class="terms" style="margin-top:15px">${e(o.terms)}</p><label class="consent"><input type="checkbox" id="checkout-consent"><span>선택한 항목, 총금액, 취소 조건을 확인했어요. 이 화면에서는 체험만 진행돼요.</span></label><button class="btn primary full" data-action="complete" data-id="${t.id}">${icon('check')}확인하고 체험 마치기</button><p class="tiny muted" style="text-align:center;margin-top:15px">정식 서비스에서는 가게 페이지에서 직접 결제를 확인할 계획이에요.<br>이 체험 화면에 주소나 카드 정보를 입력할 필요가 없어요.</p></section></div>`;}
function receipt(t){const o=scenarios[t.kind].options.find(x=>x.id===t.selected);return `<section class="receipt"><div class="state-icon">${icon('check')}</div><h2>체험을 마쳤어요</h2><p>${e(o.name)} · 체험 금액 ${money(o.price+o.shipping)}</p>${t.date?`<p>체험 예약 · ${e(t.date)} ${e(t.time)}</p>`:''}<p class="tiny" style="margin-top:12px">체험 확인증 ${e(t.receipt)}<br>실제 주문, 예약, 결제 금액은 없어요.</p><div class="row wrap" style="justify-content:center"><button class="btn primary" data-action="go" data-view="home">홈으로</button><button class="btn secondary" data-action="download-receipt" data-id="${t.id}">체험 확인증 저장</button></div></section>`;}
function render(){document.body.classList.toggle('font-large',!!db.settings.large);let html=view==='home'?(role==='elder'?home():childHome()):view==='task'?taskPage():view==='tasks'?tasksPage():view==='family'?familyPage():view==='settings'?settingsPage():aboutPage();app.innerHTML=shell(html);document.title=(view==='task'?current()?.title:'곁에')+' · 가족과 함께하는 생활 도우미';}
function modal(title,body){dialog.innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="iconbtn" data-action="close" aria-label="닫기">${icon('close')}</button></div>${body}`;if(!dialog.open)dialog.showModal();}
function ask(t){const s=scenarios[t.kind];modal('딸에게 요청 보내기',`<p class="modal-copy">공유할 내용을 먼저 확인해 주세요. 동의하시면 자녀용 화면에 표시돼요.</p><form data-form="ask" data-id="${t.id}"><div class="shared-card"><h3>${e(t.title)}</h3><p>비교 항목 · ${s.options.map(o=>e(o.name)+' '+money(o.price+o.shipping)).join(' / ')}</p><p>이 일의 조건, 후보, 궁금한 점을 공유해요.</p></div><label class="field">원하는 조건<input name="need" value="${e(s.need)}" maxlength="200" required></label><label class="field">딸에게 무엇을 물어볼까요?<textarea name="concern" maxlength="300" required>${e(s.question)}</textarea></label><label class="consent"><input type="checkbox" name="consent" required><span>원하는 조건과 비교 항목, 궁금한 점을 체험용 자녀 화면에 공유하는 데 동의해요.</span></label><button class="btn primary full" type="submit">${icon('heart')}동의하고 도움 요청하기</button><p class="tiny muted" style="text-align:center;margin-top:12px">이 브라우저의 자녀용 화면에서 확인할 수 있어요.</p></form>`);}
function speak(text){if(!('speechSynthesis'in window)){notify('이 기기에서는 음성 읽기를 사용할 수 없어요. 화면에서 내용을 확인해 주세요.');return;}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(text);utter.lang='ko-KR';utter.rate=.87;const voice=speechSynthesis.getVoices().find(v=>v.lang==='ko-KR')||speechSynthesis.getVoices().find(v=>v.lang.startsWith('ko'));if(voice)utter.voice=voice;utter.onerror=()=>notify('지금은 음성 읽기를 사용할 수 없어요.');speechSynthesis.speak(utter);notify('음성으로 읽는 중이에요. 설정에서 멈출 수 있어요.');}
let recognition=null;
function voice(button){const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){notify('이 브라우저에서는 음성 입력을 사용할 수 없어요. 글로 입력해 주세요.');button.closest('form').querySelector('input').focus();return;}if(recognition){recognition.stop();return;}const input=button.closest('form').querySelector('input');recognition=new Recognition();recognition.lang='ko-KR';recognition.interimResults=false;recognition.continuous=false;button.classList.add('listening');button.setAttribute('aria-label','음성 입력 멈추기');notify('말씀해 주세요. 브라우저의 음성 인식 기능을 사용해요.');recognition.onresult=ev=>{input.value=ev.results[0][0].transcript;input.focus();notify('입력된 문장을 확인하고 보내기 버튼을 눌러 주세요.');};recognition.onerror=ev=>notify(ev.error==='not-allowed'?'마이크를 사용할 수 없어요. 글로 입력하셔도 돼요.':'잘 듣지 못했어요. 다시 말씀하시거나 글로 입력해 주세요.');recognition.onend=()=>{button.classList.remove('listening');button.setAttribute('aria-label','음성 입력 시작');recognition=null;};try{recognition.start();}catch{recognition=null;button.classList.remove('listening');notify('마이크를 사용할 수 없어요. 글로 입력해 주세요.');}}
function download(name,text,type='application/json'){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function doAction(button){const a=button.dataset.action,id=button.dataset.id;try{
if(a==='go'){go(button.dataset.view);}
else if(a==='role'){role=button.dataset.role;try{sessionStorage.setItem('banni.role',role);}catch{}go('home');notify(role==='child'?'자녀용 화면이에요. 공유된 요청을 확인할 수 있어요.':'어르신용 화면으로 바꿨어요.');}
else if(a==='start')start(button.dataset.kind);
else if(a==='open-task'){const t=db.tasks.find(x=>x.id===id);if(t?.status==='paused')changeTask(id,'resume');go('task',id);}
else if(a==='child-open'){role='child';go('family');setTimeout(()=>document.getElementById('request-'+id)?.scrollIntoView({behavior:'smooth',block:'start'}),50);}
else if(a==='font'){reload();db.settings.large=!db.settings.large;persist();render();notify(db.settings.large?'큰 글씨를 켰어요.':'기본 글자 크기로 바꿨어요.');}
else if(a==='read-toggle'){reload();db.settings.read=!db.settings.read;persist();render();if(db.settings.read)speak('답변 자동 읽기를 켰어요.');else window.speechSynthesis?.cancel();}
else if(a==='speak')speak(button.dataset.text);
else if(a==='stop-speak'){window.speechSynthesis?.cancel();notify('읽기를 멈췄어요.');}
else if(a==='voice')voice(button);
else if(a==='notifications'){if(role==='child')go('family');else{const t=db.tasks.find(t=>t.status==='advised')||db.tasks.find(t=>t.status==='waiting');if(t)go('task',t.id);else notify('새로운 가족 소식이 없어요.');}}
else if(a==='services')modal('체험 선택',`<p class="modal-copy">구매, 예약, 음식 주문 중 하나를 선택해 주세요.</p><div class="stack">${Object.entries(scenarios).map(([k,s])=>`<button class="btn secondary full" data-action="modal-start" data-kind="${k}">${icon(s.icon)}${s.short}${icon('arrow')}</button>`).join('')}</div>`);
else if(a==='modal-start'){dialog.close();start(button.dataset.kind);}
else if(a==='close')dialog.close();
else if(a==='select'){changeTask(id,'select',{id:button.dataset.option});render();notify('항목을 골랐어요. 확인 전에는 바꿀 수 있어요.');}
else if(a==='ask')ask(db.tasks.find(t=>t.id===id));
else if(a==='revoke'){changeTask(id,'revoke');render();notify('요청을 철회했어요.');}
else if(a==='recommend-select'){selectedReply[id]=button.dataset.option;render();document.querySelector(`[data-form="reply"][data-id="${id}"] textarea`)?.focus({preventScroll:true});}
else if(a==='review'){const t=db.tasks.find(t=>t.id===id);let date=document.querySelector('#booking-date')?.value||'',clock=document.querySelector('#booking-time')?.value||'';if(t.kind==='haircut'&&(!date||!document.querySelector('#booking-date').checkValidity())){notify('오늘 이후의 날짜를 선택해 주세요.');document.querySelector('#booking-date')?.focus();return;}changeTask(id,'checkout',{date,time:clock});go('task',id);}
else if(a==='back-checkout'){changeTask(id,'back');render();}
else if(a==='complete'){if(!document.querySelector('#checkout-consent').checked){notify('내용을 확인하신 뒤 확인란에 표시해 주세요.');document.querySelector('#checkout-consent').focus();return;}changeTask(id,'complete',{confirm:true});go('task',id);notify('결제 체험을 마쳤어요.');}
else if(a==='cancel')modal('이 일을 취소할까요?',`<p class="modal-copy">취소하면 이 일을 이어서 할 수 없어요. 홈에서 다시 시작할 수 있어요.</p><div class="row"><button class="btn secondary grow" data-action="close">이 일 유지</button><button class="btn primary grow" data-action="confirm-cancel" data-id="${id}">취소하기</button></div>`);
else if(a==='confirm-cancel'){changeTask(id,'cancel');dialog.close();render();notify('이 일을 취소했어요');}
else if(a==='pause'){changeTask(id,'pause');render();notify('지금까지 한 일을 저장했어요.');}
else if(a==='resume'){changeTask(id,'resume');render();}
else if(a==='call')modal('가족과 상의할 내용',`<p class="modal-copy">아래 질문을 참고해 의견을 써 보세요.</p><div class="shared-card"><h3>함께 살펴볼 질문</h3><p>① 가격, 거리, 쓰기 쉬운 정도 중 무엇이 가장 중요한가요?</p><p>② 추천한 항목을 이용할 때 불편한 점이 있나요?</p><p>③ 지금 고를까요, 저장해 두고 나중에 고를까요?</p></div><button class="btn primary full" style="margin-top:20px" data-action="close">돌아가서 의견 쓰기</button>`);
else if(a==='privacy')modal('개인정보 안내',`<p class="modal-copy">체험 기록은 이 브라우저에 저장돼요.</p><div class="shared-card"><h3>가족에게 공유되는 내용</h3><p>자녀용 화면에는 원하는 조건, 후보, 궁금한 점이 표시돼요. 요청은 철회할 수 있고 최종 확인은 어르신이 해요.</p><p>화면 전환은 체험용이에요. 체험에는 예시 정보를 사용해 주세요.</p><p>음성 입력은 브라우저 기능을 사용하며 인터넷 연결과 마이크 권한이 필요할 수 있어요.</p><p>설정에서 이 브라우저의 기록을 내보내거나 지울 수 있어요.</p></div><button class="btn primary full" style="margin-top:20px" data-action="close">확인</button>`);
else if(a==='export'){download('곁에-체험기록.json',JSON.stringify({app:'곁에 체험 앱',exportedAt:new Date().toISOString(),tasks:db.tasks},null,2));notify('기록을 내보냈어요.');}
else if(a==='download-receipt'){const t=db.tasks.find(t=>t.id===id);download('곁에-체험확인증-'+t.receipt+'.txt',`곁에 · 체험 확인증\n${t.title}\n확인증 번호 · ${t.receipt}\n${t.date?'체험 예약 · '+t.date+' '+t.time+'\n':''}체험용 기록입니다. 실제 주문, 예약, 결제 금액은 없습니다.`,'text/plain;charset=utf-8');}
else if(a==='reset')modal('이 브라우저의 체험 기록을 지울까요?',`<p class="modal-copy">이 브라우저에 저장된  ${db.tasks.length} 건이 삭제돼요. 기록을 남기려면 먼저 내보내 주세요.</p><div class="row"><button class="btn secondary grow" data-action="close">기록 유지</button><button class="btn primary grow" data-action="confirm-reset">모두 지우기</button></div>`);
else if(a==='confirm-reset'){db.tasks=[];persist();active=null;dialog.close();render();notify('이 브라우저의 체험 기록을 지웠어요.');}
}catch(err){notify(err.message||'처리하지 못했어요. 다시 시도해 주세요.');reload();render();}}
document.addEventListener('click',ev=>{const button=ev.target.closest('[data-action]');if(button){ev.preventDefault();if(!button.disabled)doAction(button);}});
document.addEventListener('submit',ev=>{const form=ev.target.closest('[data-form]');if(!form)return;ev.preventDefault();try{const data=new FormData(form);if(form.dataset.form==='ask'){changeTask(form.dataset.id,'request',{consent:data.get('consent')==='on',need:String(data.get('need')||'').trim(),concern:String(data.get('concern')||'').trim()});dialog.close();render();notify('자녀용 화면에 요청을 표시했어요.');}else if(form.dataset.form==='reply'){const id=form.dataset.id;changeTask(id,'reply',{id:selectedReply[id],text:String(data.get('advice')||'').trim()});delete selectedReply[id];render();modal('어르신에게 의견을 보냈어요',`<p class="modal-copy">어르신용 화면에서 의견을 읽고 원하는 항목을 고를 수 있어요.</p><div class="shared-card"><h3>의견 보내기 완료</h3><p>최종 선택은 어르신용 화면에서 확인할 수 있어요.</p></div><button class="btn primary full" style="margin-top:20px" data-action="return-elder" data-id="${id}">어르신용 화면에서 의견 보기 ${icon('arrow')}</button>`);}else if(form.dataset.form==='chat'){const text=String(data.get('message')||'').trim();if(!text){notify('하고 싶은 일을 먼저 입력해 주세요.');return;}if(form.dataset.context==='home'){const kind=/밥솥|쇼핑|구매|물건|사고\s*싶/.test(text)?'shop':/미용실|이발|미용|머리/.test(text)?'haircut':/음식|점심|식사|주문|배달/.test(text)?'meal':/예약/.test(text)?'haircut':null;if(kind){start(kind);appendMessage(text,'관련 체험을 열었어요. 후보와 조건은 예시이며, 가족에게 물어볼 때 원하는 조건을 직접 수정할 수 있어요.');}else{modal('어떤 체험을 해 볼까요?',`<p class="modal-copy">입력하신 내용 · “${e(text)}”</p><p class="small muted">전기밥솥 사기, 미용실 예약, 점심 주문 중 하나를 골라 시작해 보세요.</p><div class="stack" style="margin-top:20px">${Object.entries(scenarios).map(([k,s])=>`<button class="btn secondary" data-action="modal-start" data-kind="${k}">${icon(s.icon)}${s.short}</button>`).join('')}</div>`);}}else{const t=current();if(/딸|아들|자녀|가족|결정하기 어려|결정 못|뭘 골라|고민/.test(text)&&['choosing','advised'].includes(t.status)){appendMessage(text,'물론이죠. 가족에게 공유할 내용을 살펴보고 동의해 주세요.');ask(current());}else{const answer=/가격|저렴|얼마/.test(text)?scenarios[t.kind].options.map(o=>o.name+' 총 '+money(o.price+o.shipping)+(o.shipping?' (배송비 포함)':'')).join(' · ')+'. 체험용 예시 금액이에요.':/취소|반품|변경/.test(text)?scenarios[t.kind].options.map(o=>o.name+' · '+o.terms).join('\n'):/쉬운|쉽|버튼|차이|어떤 게/.test(text)?scenarios[t.kind].options.map(o=>o.name+' · '+o.details.join(' · ')).join('\n'):'입력하신 내용을 남겼어요. 후보의 가격이나 취소 조건을 물어보거나 ‘딸에게 물어보기’를 눌러 궁금한 점을 공유할 수 있어요.';appendMessage(text,answer);form.reset();}}}}catch(err){notify(err.message||'다시 시도해 주세요.');}});
function appendMessage(text,answer){reload();const i=db.tasks.findIndex(t=>t.id===active);if(i<0)return;db.tasks[i].messages.push({role:'user',text},{role:'assistant',text:answer});persist();render();if(db.settings.read)speak(answer);}
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-action="return-elder"]');if(b){dialog.close();role='elder';try{sessionStorage.setItem('banni.role',role);}catch{}go('task',b.dataset.id);}});
document.addEventListener('input',ev=>{if(ev.target.name==='advice'){const f=ev.target.closest('[data-form="reply"]');if(f)adviceDrafts[f.dataset.id]=ev.target.value;}});
document.addEventListener('change',ev=>{if(['booking-date','booking-time'].includes(ev.target.id)&&current()){const date=document.querySelector('#booking-date')?.value||'',clock=document.querySelector('#booking-time')?.value||'14:00';reload();const t=current();if(t&&['choosing','advised'].includes(t.status)){t.date=date;t.time=clock;persist();}}});
window.addEventListener('storage',ev=>{if(ev.key===KEY){reload();render();if(dialog.open){dialog.close();notify('가족의 진행 상황이 바뀌었어요. 화면을 다시 열어 주세요.');}}});
dialog.addEventListener('click',ev=>{if(ev.target===dialog){const box=dialog.getBoundingClientRect();if(ev.clientX<box.left||ev.clientX>box.right||ev.clientY<box.top||ev.clientY>box.bottom)dialog.close();}});
render();

</script>
</body></html>
